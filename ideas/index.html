<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Ideas &middot; Personal Site</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       margin: 0; padding: 0 16px 48px; max-width: 760px; margin-left: auto; margin-right: auto;
       line-height: 1.5; }
header { padding: 20px 0 8px; border-bottom: 1px solid #ccc; margin-bottom: 16px; }
header h1 { font-size: 1.4rem; margin: 0 0 8px; }
nav a { margin-right: 16px; text-decoration: none; font-weight: 600; }
nav a.active { text-decoration: underline; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.controls input[type="search"], .controls select {
  font-size: 1rem; padding: 8px 10px; border: 1px solid #999; border-radius: 8px; }
.controls input[type="search"] { flex: 1 1 200px; }
.card { border: 1px solid #ccc; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 1.1rem; }
.badges { margin: 6px 0; }
.badge { display: inline-block; font-size: 0.75rem; background: #eee; color: #333;
         border-radius: 20px; padding: 2px 10px; margin: 0 6px 4px 0; }
.meta { color: #666; font-size: 0.85rem; }
.detail { margin-top: 10px; }
.detail h4 { margin: 12px 0 4px; font-size: 0.95rem; }
.detail ul, .detail ol { margin: 4px 0 8px; padding-left: 22px; }
.empty { color: #666; padding: 24px 0; }
.itinerary { white-space: pre-line; }
footer { margin-top: 32px; color: #888; font-size: 0.8rem; }
.home-links { display: grid; gap: 12px; margin-top: 16px; }
.home-links a { display: block; border: 1px solid #ccc; border-radius: 10px;
                padding: 16px; text-decoration: none; color: inherit; }
.home-links a strong { font-size: 1.15rem; display: block; margin-bottom: 4px; }
.home-links a span { color: #666; font-size: 0.9rem; }
</style>
</head>
<body>
<header><h1>Personal Site</h1><nav><a href="/" class="">Home</a><a href="/recipes/" class="">Recipes</a><a href="/media/" class="">Media List</a><a href="/ideas/" class="active">Dinner Ideas</a><a href="/travel/" class="">Travel Bucket List</a><a href="/try/" class="">Things to Try</a></nav></header>
<main>
<h2>Dinner Ideas</h2>
<div class="controls">

</div>
<div id="list"></div>
<script>

, "notes": ""}, {"id": 15, "title": "Carnitas", "tags": ["dinner", "pork"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 16, "title": "Tortellini soup", "tags": ["soup"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 17, "title": "Butter chicken", "tags": ["dinner", "indian"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 18, "title": "Chicken paprikash", "tags": ["dinner", "hungarian"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 19, "title": "Tadig rice", "tags": ["side", "rice"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 20, "title": "Filthier Cabbage", "tags": ["side"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 21, "title": "French Onion Soup Mac & Cheese", "tags": ["dinner", "pasta"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 22, "title": "Super Green Pasta Salad", "tags": ["dinner", "salad"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 23, "title": "Lasagna Pinwheels", "tags": ["dinner"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 24, "title": "Smoked pulled pork", "tags": ["bbq", "smoker", "pork"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 25, "title": "Smoked pork ribs", "tags": ["bbq", "smoker", "pork"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 26, "title": "Smoked chili", "tags": ["bbq", "smoker"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 27, "title": "Smoked bologna", "tags": ["bbq", "smoker"], "status": "to_try", "linked_recipe_id": null, "notes": ""}, {"id": 28, "title": "BBQ tacos", "tags": ["bbq", "smoker", "tacos"], "status": "to_try", "linked_recipe_id": null, "notes": ""}];
const RECIPES = {"1": "Crispy Smoked Paprika Potato Wedges", "2": "Sheet Pan Breakfast Burritos", "3": "Cajun Chicken and Dumplings", "4": "Johnny Blakes Pea Soup", "6": "Dirty Rice", "9": "Minestrone", "5": "Kielbasa and Cabbage", "8": "Mortadella Sandwiches", "16": "Turkey Subs", "13": "Shredded Beef Sandwiches", "7": "Shredded Chicken Sandwiches", "15": "French Onion Roast Beef and Cheddar Sliders", "14": "Catfish Filets", "10": "Blue Collar Belly Warmer", "11": "Chicken and Stuffing", "12": "Samoan Corn Beef Gravy", "17": "Pot Roast (w/ Packets)", "19": "Crockpot Ribs", "18": "Crockpot Jambalaya", "21": "Cheesy Pizza Tortellini", "25": "Beef Braised Short Ribs", "27": "Short Rib Ragu", "26": "Swedish Meatballs", "22": "Hot Honey Chicken", "23": "Mini Chicken Pot Pies", "24": "Steak Alfredo w/ Cajun Butter", "28": "Huli Huli", "20": "Corn Souffle", "36": "Crispy Parm Potatoes", "34": "Collard Greens", "31": "Twice Baked Potatoes", "33": "Parmesan Carrot Fries", "38": "Creamy Orzo", "40": "Spaghetti Squash", "35": "Authentic Fried Rice", "30": "Cinnamon Roll Pie Crust", "32": "Crock pot Blueberry Cobbler", "29": "Banana Pudding", "39": "Cheat Lemon Pie", "41": "Cheat Box Cake", "37": "Chocolate Eclair Cake", "43": "Loaded Carrot Cake", "45": "Cream Cheese Frosting", "42": "Meatballs", "44": "Chili", "51": "Gruel", "47": "Seven days of Breakfast Oatmeal", "48": "Ground Beef and Rice", "53": "Protein Apple Pie", "46": "Vegetable Pasta", "52": "Cowboy Butter", "49": "Dijon Pork Sauce", "50": "Blackberry Gin"};
const q = document.getElementById('q'), st = document.getElementById('st'),
      tag = document.getElementById('tag'), list = document.getElementById('list');
function badge(t){ return '<span class="badge">'+t+'</span>'; }
function render(){
  const needle = q.value.trim().toLowerCase();
  const items = IDEAS.filter(m => {
    if (st.value && (m.status||'idea') !== st.value) return false;
    if (tag.value && !(m.tags||[]).includes(tag.value)) return false;
    if (needle) {
      const hay = (m.title+' '+(m.personal_notes||'')).toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  });
  if (!items.length) { list.innerHTML = '<p class="empty">No ideas yet. Send a list in chat and they will show up here.</p>'; return; }
  list.innerHTML = items.map(m => {
    const made = (m.status||'idea') === 'made';
    const rtitle = m.promoted_recipe_id && RECIPES[m.promoted_recipe_id];
    return `
    <div class="card">
      <h3>${m.title}</h3>
      <div class="badges">${badge(made ? 'Made' : 'Idea')}${(m.tags||[]).map(badge).join('')}</div>
      ${m.personal_notes ? `<p>${m.personal_notes}</p>` : ''}
      ${rtitle ? `<p class="meta">Became recipe: <a href="/recipes/">${rtitle}</a></p>` : ''}
      ${m.source_description ? `<p class="meta">From: ${m.source_description}</p>` : ''}
    </div>`;}).join('');
}
[q,st,tag].forEach(el => el.addEventListener('input', render));
render();
</script></main>
<footer>Personal collection &middot; updated automatically</footer>
</body>
</html>
