const TYPE_LABEL = {"book": "Book", "movie": "Movie", "tv_show": "TV show", "game": "Game"};
const STATUS_LABEL = {"want_to_start": "Want to start", "in_progress": "In progress", "finished": "Finished"};
const q = document.getElementById('q'), typ = document.getElementById('typ'),
      gen = document.getElementById('gen'), st = document.getElementById('st'),
      list = document.getElementById('list');
function badge(t){ return '<span class="badge">'+t+'</span>'; }
function render(){
  const needle = q.value.trim().toLowerCase();
  const items = MEDIA.filter(m => {
    if (typ.value && m.type !== typ.value) return false;
    if (gen.value && !(m.genres||[]).includes(gen.value)) return false;
    if (st.value && (m.status||'want_to_start') !== st.value) return false;
    if (needle) {
      const hay = (m.title+' '+(m.personal_notes||'')).toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  });
  if (!items.length) { list.innerHTML = '<p class="empty">Nothing here yet. Send titles in chat and they will show up.</p>'; return; }

    <div class="card">
      <h3>${m.title}</h3>
      <div class="badges">${badge(TYPE_LABEL[m.type]||m.type)}${badge(STATUS_LABEL[m.status||'want_to_start']||m.status)}${(m.genres||[]).map(badge).join('')}</div>

}
