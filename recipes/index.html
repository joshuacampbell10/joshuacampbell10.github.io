<script>
const RECIPES = [{"date_added": "2026-10-10T12:21:18.729Z", "description": "Feeds 4 as a side.", "id": 1, "ingredients": ["1kg Maris Piper potatoes", "Vegetable oil", "2 tsp smoked paprika", "1 tsp dried oregano", "Ground sea salt"], "personal_notes": "", "source_reference": "@amysheppardfood on TikTok", "source_type": "tiktok", "steps": ["Peel the potatoes, cut them into wedges and soak them in cold water for a couple of minutes, changing the water twice to rinse off the starch.", "Place the wedges in a saucepan and cover them in cold salted water.", "Bring the potato water to a simmer and cook for around 5 minutes. The potatoes should still be firm enough to shake them up without them breaking.", "Heat the oven to 220C fan.", "Drain the potatoes in a colander and give them a good shake. Stir them with the metal prongs of a fork to fluff them up a little. Leave in the colander until there is no longer steam coming off them.", "Heat oil in a thin-based roasting tin (enough to just cover the bottom so all the wedges touch the base) until spitting hot.", "Stir the paprika and oregano into the oil.", "Tip the wedges into the pan and use a fish slice to turn them over until coated in herby oil.", "Season generously with salt.", "Roast in the oven for 12 minutes, remove and turn them over again to get another coating of the oil.", "Return to the oven for 12 more minutes, remove again and turn them over, before roasting for a final 5-7 minutes or until crisp and cooked through."], "tags": ["side", "potatoes"], "title": "Crispy Smoked Paprika Potato Wedges", "updated_at": "2026-10-10T12:21:18.729Z"}, {"description": "Makes 10 burritos — store frozen. Per burrito: 445 calories, 33g protein, 46g carbs, 14g fat. Highly customizable.", "id": 2, "ingredients": ["Veggie base:", "1 red bell pepper, diced", "1 orange bell pepper, diced", "1 yellow onion, diced", "400g yellow potatoes (~2-3), diced", "30g (2 Tbsp) olive oil", "Salt and pepper to taste", "Lean breakfast sausage:", "448g (16oz) 93% lean ground beef or turkey", "2 tsp coarse salt", "1 tsp garlic powder", "1 tsp chili powder", "1/2 tsp rubbed sage", "1/2 tsp Italian seasoning", "1/2 tsp cumin", "(or your favorite all-purpose seasoning)", "Egg mixture:", "650g (2.75 cups) egg whites", "3 eggs", "200g (1 cup) cottage cheese", "8g (1 Tbsp) corn starch", "50g (1/2 cup) shredded cheddar", "10 burrito-sized tortillas", "High-protein cream sauce:", "400g (2 cups) fat-free Greek yogurt", "50g (3 Tbsp) hot sauce of choice", "Garlic, salt and pepper to taste", "Cilantro, as garnish"], "personal_notes": "Pan: a 10x15 inch 'jelly roll' pan with 1-inch lip. A half-size sheet pan works but the rectangles come out shorter and wider.", "source_reference": "Stealth Health Life on TikTok", "source_type": "tiktok", "steps": ["Add your veggies/roasting ingredients of choice to a sheet pan and roast until softened.", "Add your protein source of choice over the top and bake until browned.", "Pour over the blended egg mixture, top with the cheddar, and bake until the middle is firm and the edges are crisp.", "Let sit for 10 minutes before slicing.", "Slice into equally sized rectangles. Add each to a burrito-sized tortilla along with sauce and garnishes of choice.", "Roll the burritos and enjoy — or wrap and store frozen."], "tags": ["meal prep", "breakfast", "burritos", "freezer"], "title": "Sheet Pan Breakfast Burritos"}, {"description": "Cajun-style chicken and dumplings made with biscuit dumplings.", "id": 3, "ingredients": ["3 boneless, skinless chicken breasts", "2 tbsp Worcestershire sauce", "1 tbsp mustard", "1 tsp salt", "1 tsp black pepper", "1 tbsp Cajun seasoning", "1 tsp garlic powder", "1 tsp onion powder", "1 tsp McCormick's Garlic & Herb seasoning", "Olive oil, for browning", "1 stick (1/2 cup) butter", "1 onion, chopped", "1 bell pepper, chopped", "3 stalks celery, chopped", "5 cloves garlic, minced", "32 oz chicken broth", "1 can cream of mushroom soup", "1 can cream of chicken soup", "1 tsp each: salt, pepper, Cajun seasoning, garlic powder, and McCormick's Garlic & Herb seasoning (for the sauce)", "1 can Pillsbury Grands Buttery Flaky Biscuits, cut into quarters"], "personal_notes": "", "source_reference": "Little Cajun House on TikTok", "source_type": "tiktok", "steps": ["Marinate the chicken: in a bowl, combine the Worcestershire sauce, mustard, salt, pepper, Cajun seasoning, garlic powder, onion powder, and McCormick's Garlic & Herb. Add the chicken breasts and marinate at least 30 minutes (or overnight for deeper flavor).", "Brown the chicken: heat a little olive oil in a large heavy pot or Dutch oven over medium-high heat. Brown the chicken 3-4 minutes per side until golden brown. Remove and set aside.", "Saute the Holy Trinity: in the same pot, melt the stick of butter. Add the chopped onion, bell pepper, and celery; saute 6-8 minutes until softened. Add the minced garlic and cook another minute.", "Make the base: pour in the chicken broth, cream of mushroom, and cream of chicken soups. Season with salt, pepper, Cajun seasoning, garlic powder, and McCormick's Garlic & Herb. Stir well.", "Simmer the chicken: add the browned chicken back to the pot. Cover and simmer on medium-low for 25 minutes.", "Add the dumplings: cut each biscuit into quarters. Layer the biscuit pieces evenly over the chicken mixture, spooning a bit of sauce over them. Cover and simmer 15 minutes (do not lift the lid).", "Finish: remove the lid and gently break up and stir the dumplings into the sauce."], "tags": ["dinner", "cajun", "chicken", "comfort food"], "title": "Cajun Chicken and Dumplings"}, {"description": "Hearty split pea soup with ham bone, vegetables, and garlic.", "id": 4, "ingredients": ["3 bags split peas, cleaned", "Water as directed on bag", "1 heaping tablespoon marjoram leaf", "1 heaping tablespoon pepper", "1 ham bone and a couple pieces of fat", "3 chicken bouillon cubes", "3 bay leaves", "3 heaping tablespoons minced garlic", "1 bag carrots, cleaned and sliced", "1 big white onion, chopped"], "personal_notes": "", "source_reference": "Johnny Blakes", "source_type": "tiktok", "steps": ["Add 3 bags of split peas (cleaned) and water as directed on the bag.", "Boil the peas and scoop off the scum from the top (very important).", "Let boil for 3 minutes, then remove from flame, cover, and let sit for 1 hour.", "Add the heaping tablespoon of marjoram leaf, heaping tablespoon of pepper, ham bone, and fat.", "Stir constantly.", "When the meat is falling off the bone, remove the bone and fat from the pot. Throw the fat away, cut the meat from the bone and put it back in the pot (give the bone to the dog).", "Add 3 chicken bouillon cubes, 3 bay leaves, 3 heaping tablespoons minced garlic, 1 bag of carrots (cleaned and sliced), and 1 big white onion (chopped).", "Stir constantly - the peas stick to the bottom of the pot and burn, ruining the soup."], "tags": ["soup", "dinner"], "title": "Johnny Blakes Pea Soup"}, {"id": 6, "title": "Dirty Rice", "description": "", "ingredients": [], "steps": ["Sauté diced vegetables in butter.", "Stir in and brown ground meat (sausage, pork, ground beef, etc).", "Season.", "Mix in dry rice and combine well, then add double the amount of liquid (stock).", "Cover and simmer until done."], "tags": ["dinner", "rice", "cajun"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 9, "title": "Minestrone", "description": "", "ingredients": [], "steps": ["Sauté onion, celery, carrot, garlic, red potato, and seasoning.", "Add crushed tomato, broth, pasta, beans, and basil.", "Cover and simmer for 30 minutes."], "tags": ["soup"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 5, "title": "Kielbasa and Cabbage", "description": "", "ingredients": [], "steps": ["Sauté kielbasa, then add carrots, celery, cabbage, and potatoes; stir well.", "Add seasonings and stir well: salt, pepper, bay leaf, Italian seasoning, and a little bit of cloves.", "Add broth and water."], "tags": ["soup", "dinner"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 8, "title": "Mortadella Sandwiches", "description": "Anthony Bourdain's Favorite Sandwich", "ingredients": [], "steps": ["Fry a couple slices of mortadella with cheese in a cast iron skillet.", "Toast a kaiser or brioche roll.", "Add mayo and Dijon."], "tags": ["sandwich"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 16, "title": "Turkey Subs", "description": "", "ingredients": [], "steps": ["Prepare tomato salad: dice a tomato, add oregano, salt, pepper, and olive oil.", "Cut into a sub roll; add mayo to the bottom and Italian seasoning.", "Layer lettuce on the bottom, top with submarine sauce and tomato salad.", "Add sliced mozzarella and shaved turkey breast."], "tags": ["sandwich"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 13, "title": "Shredded Beef Sandwiches", "description": "", "ingredients": [], "steps": ["Season a chuck roast with salt, pepper, and garlic; sear in a Dutch oven.", "Add a couple tablespoons of butter, a packet of au jus gravy, 1 tbsp Worcestershire, and A1.", "Add a 12 oz beer, a sliced onion, and 1 tbsp minced garlic.", "Cover and bake at 350°F for 2.5 hours.", "Shred the meat; toast sub rolls and top with Swiss and shredded beef, then broil to melt.", "Use remaining au jus as dip."], "tags": ["sandwich", "beef"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 7, "title": "Shredded Chicken Sandwiches", "description": "", "ingredients": [], "steps": ["Add a pound of chicken to the crockpot; season with salt, pepper, garlic.", "Add 1/4 cup pickle juice and wing sauce.", "Cook on low for 4 hours.", "Shred the chicken; add more wing sauce and serve on toasted burger buns with ranch and pickles."], "tags": ["sandwich", "chicken", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 15, "title": "French Onion Roast Beef and Cheddar Sliders", "description": "", "ingredients": [], "steps": ["Melt butter in a pan and caramelize one onion. Add thyme and garlic, then 1 tbsp flour and stir in.", "Slowly whisk in 1.5 cups beef stock and 2 tsp Worcestershire; season to taste.", "Remove from heat and mix with 1 lb sliced roast beef cut to bite-size pieces.", "Toast the bottoms of Hawaiian rolls in a baking dish with butter; top with the beef mix and cheddar.", "Add the top buns and bake until the top is crispy."], "tags": ["sandwich", "beef"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 14, "title": "Catfish Filets", "description": "", "ingredients": [], "steps": ["Put catfish filets in a bowl; season with Sazón, garlic powder, and Old Bay.", "Coat in a little buttermilk.", "Mix flour, cornmeal, cornstarch, and seasoning in a ziploc bag.", "Coat the fish in the flour mixture.", "Fry in oil."], "tags": ["dinner", "fish"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 10, "title": "Blue Collar Belly Warmer", "description": "", "ingredients": [], "steps": ["Layer mashed potatoes in a casserole dish.", "Cook 1 lb ground beef in a can of gravy.", "Add corn and green beans.", "Cut 4 biscuits into quarters and lay them into the casserole.", "Bake at 350°F until done."], "tags": ["dinner", "casserole"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 11, "title": "Chicken and Stuffing", "description": "", "ingredients": [], "steps": ["Layer about 6 chicken tenderloins in a glass baking dish.", "Cover with a can of cream of chicken soup.", "Top with black pepper.", "Top with a box of Stove Top stuffing.", "Cover with chicken stock to moisten everything.", "Cook at 375°F covered for 10 minutes, then uncovered for 10 minutes."], "tags": ["dinner", "chicken"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 12, "title": "Samoan Corn Beef Gravy", "description": "", "ingredients": [], "steps": ["Put 1/3 cup oil in a pan.", "Add one large onion chopped in large pieces; once softened, add half a head of garlic finely chopped.", "Before the garlic burns, add 6 tbsp flour.", "Cook until the flour browns; add 2 cups water.", "Once the gravy is thick, add a can of corned beef.", "Mix in salt and pepper; serve over rice."], "tags": ["dinner"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 17, "title": "Pot Roast (w/ Packets)", "description": "", "ingredients": [], "steps": ["Season the roast with salt, pepper, a ranch seasoning packet, Montreal steak seasoning, garlic powder, and paprika.", "Sear in a Dutch oven.", "Remove the roast; add onion, garlic, tomato paste, and broth.", "Add more seasonings plus a pot roast seasoning packet.", "Add the roast back and simmer for 1 hour.", "Add potatoes and carrots; simmer another 1.5 hours.", "Serve over mashed potatoes or rice."], "tags": ["dinner", "beef", "pot-roast"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 19, "title": "Crockpot Ribs", "description": "", "ingredients": [], "steps": ["Prep a rack of ribs; season liberally and coat with Sweet Baby Ray's.", "Add to the crockpot with a sliced red onion.", "Add 2 cups of Coke or Dr Pepper.", "Cook on low 7-8 hours until fall-off-the-bone.", "Add more BBQ sauce and finish 30 minutes."], "tags": ["dinner", "ribs", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 18, "title": "Crockpot Jambalaya", "description": "", "ingredients": [], "steps": ["Put 2 lb sliced kielbasa, 2 chopped red bell peppers, 1 yellow onion, 1 sliced jalapeño, 2.5 cups chicken broth, 2 cups instant rice, 3 tbsp Cajun seasoning, some Worcestershire, and 1 tbsp minced garlic in the crockpot.", "Cook on low for 3 hours."], "tags": ["dinner", "cajun", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 21, "title": "Cheesy Pizza Tortellini", "description": "", "ingredients": [], "steps": ["Cook a pound of ground beef; season with salt, pepper, onion powder, and Italian seasoning. (Test with ground Italian sausage.)", "Add 1/3 cup mini pepperoni and cook down.", "Add minced garlic, half a block of cream cheese, and a jar of marinara.", "Add one bag of frozen tortellini; cover and simmer 5-7 minutes.", "Top with shredded cheese and mini pepperoni; melt the cheese."], "tags": ["dinner", "pasta"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 25, "title": "Beef Braised Short Ribs", "description": "", "ingredients": [], "steps": ["Coat short ribs in salt and pepper.", "Heat oil in a Dutch oven; sear short ribs in batches.", "Remove all short ribs.", "Braise carrots, onion, celery, and garlic.", "Add tomato paste, red wine, beef broth, thyme, and bay leaves.", "Bake until tender.", "Remove short ribs and strain out the vegetables.", "Reduce the remaining liquid to make the sauce."], "tags": ["dinner", "beef", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 27, "title": "Short Rib Ragu", "description": "", "ingredients": [], "steps": ["Season four short ribs and sear on all sides.", "Remove short ribs; add olive oil, carrots, celery, and onion to the Dutch oven.", "Add garlic, tomato paste, and red wine; stir.", "Add a can of crushed tomatoes, rosemary, oregano, and beef stock.", "Return short ribs to the pan; cover and simmer.", "Remove short ribs when tender; shred and return to the pan.", "Add cream and ragu noodles; serve with parmesan."], "tags": ["dinner", "beef", "pasta", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 26, "title": "Swedish Meatballs", "description": "", "ingredients": [], "steps": ["Mix 1 lb spicy Italian sausage with half an onion, garlic, 1/2 cup breadcrumbs, 1 egg, ginger, black pepper, nutmeg, and allspice.", "Cook the meatballs in a sauté pan with butter; set aside.", "Add the other half of the onion and more butter.", "Add 2 tbsp flour, 1.5 cups beef broth, brown mustard, and Worcestershire.", "Add cooked noodles and meatballs."], "tags": ["dinner", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 22, "title": "Hot Honey Chicken", "description": "", "ingredients": [], "steps": ["Marinate 8-10 chicken tenderloins in 1 cup buttermilk, 1/4 cup hot sauce, salt, black pepper, cayenne, garlic powder, and onion powder. Marinate through the day.", "Mix 1 cup flour with cayenne, salt, black pepper, garlic powder, and onion powder.", "Mix 1 cup buttermilk with hot sauce, salt, and black pepper.", "Take chicken from the marinade; dredge in flour, soak in milk, then flour again. Rest 10 minutes.", "Fry until golden brown.", "For the glaze, simmer 1/4 cup butter with 1 tbsp hot sauce and 1 tbsp honey."], "tags": ["dinner", "chicken", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 23, "title": "Mini Chicken Pot Pies", "description": "", "ingredients": [], "steps": ["Shred all meat off a rotisserie chicken.", "Add a can of cream of mushroom and a can of cream of chicken to a pot with a bag of mixed vegetables; season liberally.", "Heat up; add the shredded chicken with a little stock. (Test if pre-baking the bottoms helps.)", "Layer dough in a muffin pan, add filling, and top with pie crust.", "Top with butter; bake at 400°F until crispy and done."], "tags": ["dinner", "chicken", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 24, "title": "Steak Alfredo w/ Cajun Butter", "description": "", "ingredients": [], "steps": ["Season filets with salt, pepper, and garlic powder; grill the steaks.", "Mix softened butter with Cajun seasoning.", "Boil the pasta.", "Homemade Alfredo: melt a stick of butter in a saucepan, add 16 oz half and half and bring to a simmer; slowly mix in 2 cups parmesan cheese.", "Serve the pasta with Alfredo, topped with steak and Cajun butter."], "tags": ["dinner", "steak", "pasta", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 28, "title": "Huli Huli", "description": "", "ingredients": [], "steps": ["Mix soy sauce, pineapple juice, brown sugar, ginger, garlic, and rice vinegar.", "Marinate for a few hours."], "tags": ["marinade"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 20, "title": "Corn Souffle", "description": "", "ingredients": [], "steps": ["Mix 1 can sweet cream corn, 1 can whole kernel corn (drained), 1 box Jiffy corn muffin mix, half a stick of melted butter, and 1 cup sour cream.", "Grease a baking dish and pour in the mixture.", "Bake in a preheated 350°F oven for 1.5 hours."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 36, "title": "Crispy Parm Potatoes", "description": "", "ingredients": [], "steps": ["Slice baby potatoes in half.", "Line a small baking sheet with parchment; add olive oil to the parchment.", "Layer shredded parmesan; place the potatoes face-down on the parmesan.", "Drizzle olive oil on top; bake."], "tags": ["side", "potatoes"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 34, "title": "Collard Greens", "description": "", "ingredients": [], "steps": ["Chop one onion and a pack of bacon; add to a pot with oil and minced garlic.", "Slice a bunch of collards to remove the stems; wash and slowly add to the pot, stirring. Add more oil as necessary.", "Add salt, pepper, and red pepper flakes; stir very well to combine.", "Add 2-3 cups of stock with 1 cup of brown sugar and some Tabasco; stir well.", "Bring to a boil and simmer covered for 1 hour."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 31, "title": "Twice Baked Potatoes", "description": "", "ingredients": [], "steps": ["Stab potatoes with a fork multiple times; coat in oil, salt, and pepper; wrap with aluminum foil.", "Bake completely; cut a slice down the middle.", "Scoop out the insides and mix with milk, shredded cheese, melted butter, sour cream, bacon bits, salt, pepper, and garlic powder.", "Put the mixture back into the potato skins; rebake."], "tags": ["side", "potatoes"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 33, "title": "Parmesan Carrot Fries", "description": "", "ingredients": [], "steps": ["Cut 1 lb large peeled carrots into fries.", "Toss with 1/3 cup grated parmesan, salt, pepper, minced garlic, and oil.", "Bake at 400°F for 25-30 minutes."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 38, "title": "Creamy Orzo", "description": "", "ingredients": [], "steps": ["Brown 5 tbsp butter in a pot.", "Add 2 finely minced shallots and 2 tsp minced garlic; caramelize.", "Add fresh rosemary and 1/2 tbsp honey.", "Add 1.5 cups dry orzo and toast.", "Add 4 cups chicken broth, salt, pepper, paprika, and onion powder.", "Cook on medium-high 10-15 minutes; add 1/2 cup heavy cream and 1/2 cup fresh parmesan."], "tags": ["side", "pasta"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 40, "title": "Spaghetti Squash", "description": "", "ingredients": [], "steps": ["Place the spaghetti squash in a crockpot with about 1.5 cups of water; cook on low for 2 hours.", "Scoop out the seeds. (Test baking the seeds in the oven.)", "Fluff the insides with a fork; top with butter, salt, and pepper."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 35, "title": "Authentic Fried Rice", "description": "", "ingredients": [], "steps": ["Cut up 1/2 pack Chinese-style sausage; dice an onion.", "Scramble 7-8 eggs in a different pan.", "Cook the sausage low in the wok to get some fat in the pan.", "Remove the sausage; cook chicken in the fat and oil, then remove.", "Add oil; cook onion, green onion, garlic, peas, and carrots.", "Once cooked through, add everything back including day-old rice.", "Add soy sauce, sesame oil, dark soy sauce, black pepper, white pepper, and Maggi seasoning."], "tags": ["side", "rice"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 30, "title": "Cinnamon Roll Pie Crust", "description": "", "ingredients": [], "steps": ["Use any pie filling.", "Use a can of cinnamon rolls as the crust.", "Layer cinnamon rolls on the bottom and on top of the filling.", "Egg-wash the top cinnamon rolls and cut slots."], "tags": ["dessert"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 32, "title": "Crock pot Blueberry Cobbler", "description": "", "ingredients": [], "steps": ["Dump 2 cans of blueberry pie filling in the crockpot.", "Smooth the filling; add a box of cake mix on top.", "Cut 2 sticks of butter into knobs and distribute evenly.", "Serve with vanilla ice cream."], "tags": ["dessert", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 29, "title": "Banana Pudding", "description": "", "ingredients": [], "steps": ["Blend 1 cup sweetened condensed milk with 1.5 cups cold water.", "Add 1 box instant vanilla pudding mix; mix until no clumps.", "Refrigerate until firm.", "Whisk 3 cups heavy cream until stiff peaks form; fold into the pudding mixture.", "Layer the mixture with vanilla wafer cookies.", "Refrigerate 4-6 hours."], "tags": ["dessert"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 39, "title": "Cheat Lemon Pie", "description": "", "ingredients": [], "steps": ["Stir a can of sweetened condensed milk with a can of thawed lemonade concentrate.", "Mix in a tub of Cool Whip.", "Pour into 2 premade graham cracker crusts; freeze."], "tags": ["dessert"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 41, "title": "Cheat Box Cake", "description": "", "ingredients": [], "steps": ["Replace the oil with melted butter.", "Add an extra egg.", "Use milk instead of water.", "For chocolate, add a little coffee."], "tags": ["dessert", "cake"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 37, "title": "Chocolate Eclair Cake", "description": "", "ingredients": [], "steps": ["Mix 2 boxes vanilla pudding mix with 3 cups cold milk.", "Fold in 16 oz Cool Whip.", "Layer graham crackers with the pudding mixture.", "Heat frosting in the microwave and pour over the final graham cracker layer.", "Refrigerate several hours before serving."], "tags": ["dessert", "cake"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 43, "title": "Loaded Carrot Cake", "description": "", "ingredients": [], "steps": ["Mix 3 cups flour, 2.5 cups sugar, 3 tsp baking soda, 3 tsp cinnamon, 1/2 tsp salt, 4 eggs, 1 1/3 cups oil, 1 tsp vanilla, 16 oz shredded carrots, 1 1/3 cups sweetened shredded coconut, 1 cup chopped dates, 1 cup pecans, 8 oz crushed pineapple with juice, and 1/2 cup raisins.", "Divide between 3 greased and floured cake pans; bake at 350°F for 40 minutes.", "Frost with cream cheese frosting."], "tags": ["dessert", "cake"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 45, "title": "Cream Cheese Frosting", "description": "", "ingredients": [], "steps": ["Mix 8 oz cream cheese, 1/2 cup softened unsalted butter, 1 tsp vanilla extract, a pinch of salt, and 4 cups powdered sugar."], "tags": ["dessert", "frosting"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 42, "title": "Meatballs", "description": "", "ingredients": [], "steps": ["Mix 12 lb beef and 6 lb sausage.", "Dice a green and red pepper and a yellow onion in large chunks; chop lots of parsley and tons of garlic.", "Purée in a food processor; add to the meat mixture with 6 eggs.", "Blend French bread, milk, and a scoop of beef base in the food processor; add to the meat mixture.", "Add parmesan, salt, Italian seasoning, and black pepper.", "Mix everything together by hand very well; roll into baseball-sized meatballs.", "Place on a silicone mat on a large baking tray; bake."], "tags": ["bulk", "beef"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 44, "title": "Chili", "description": "", "ingredients": [], "steps": ["Brown and drain 3 lb ground beef.", "Add 1 lb hot breakfast sausage.", "Add diced onion, diced garlic, and diced jalapeño.", "Add 44 oz diced tomatoes, 4 oz Hatch green chile, 44 oz tomato sauce, 3 packets Williams chili seasoning, and 6 oz tomato paste.", "Simmer about 1 hour.", "Add 3 cans Bush's Chili Magic beans; simmer 30 minutes."], "tags": ["bulk", "chili"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 51, "title": "Gruel", "description": "", "ingredients": [], "steps": ["Brown 2 lb ground beef.", "Add 6 eggs.", "Add a vegetable of choice.", "Add 2 packets of ready rice (Uncle Ben's).", "Add a ton of A1 sauce."], "tags": ["health", "beef"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 47, "title": "Seven days of Breakfast Oatmeal", "description": "", "ingredients": [], "steps": ["Grab 7 deli pint containers.", "Per container: 1/2 cup oatmeal, 1 scoop whey protein, dash of cinnamon.", "The night before, add a handful of frozen berries, fill with water, and leave in the fridge overnight."], "tags": ["health", "breakfast", "meal-prep"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 48, "title": "Ground Beef and Rice", "description": "", "ingredients": [], "steps": ["Add oil to a pan; brown onion and garlic.", "Add 1 lb ground beef.", "Season with soy sauce, oyster sauce, chili powder, mirin, and honey.", "Add green onion; serve over rice with avocado and fried egg."], "tags": ["health", "beef", "rice"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 53, "title": "Protein Apple Pie", "description": "", "ingredients": [], "steps": ["Heat a can of sugar-free apple pie filling in a pan; add 1/2 cup water and boil.", "Add 1 cup cinnamon protein powder; mix very well.", "Blend down granola for topping; spread evenly and spray with butter.", "Broil until golden brown; top with sugar-free ice cream."], "tags": ["health", "dessert", "protein"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 46, "title": "Vegetable Pasta", "description": "", "ingredients": [], "steps": ["Cut 1 onion, 2 bell peppers, 1 cucumber, 2 tomatoes, 2 carrots, and a clove of garlic into large chunks.", "Place on a baking dish; coat with olive oil and roast until broken down.", "Blend the roasted vegetables with a little cream.", "Serve on protein pasta with a side salad."], "tags": ["health", "pasta"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 52, "title": "Cowboy Butter", "description": "", "ingredients": [], "steps": ["Melt butter with garlic, lemon juice, lemon zest, salt, pepper, paprika, and cayenne.", "Stir in Dijon mustard, chili flakes, thyme, chives, and parsley.", "Use as a steak dip."], "tags": ["sauce"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 49, "title": "Dijon Pork Sauce", "description": "", "ingredients": [], "steps": ["Cook pork chops in a steel pan.", "Over medium heat, melt butter; add a minced shallot and salt.", "Once the shallot is translucent, add minced garlic; sauté 5 minutes.", "Deglaze with white wine; reduce.", "Add chicken stock, then cream; simmer and reduce until thick.", "Season with salt and pepper; stir in Dijon mustard.", "Return the pork to the pan to heat through; serve the pork chops with the sauce."], "tags": ["sauce", "pork"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 50, "title": "Blackberry Gin", "description": "", "ingredients": [], "steps": ["Add a tub of blackberries to a mason jar; fill with gin.", "Let infuse for a week."], "tags": ["drink"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"title": "Berried Applesauce", "description": "Jam cycle — Makes about 3 cups chunky-style applesauce", "ingredients": ["2 pounds apples, peeled, cored, quartered and thinly sliced (⅛-inch)", "1 cup (5 ounces) quartered strawberries", "⅔ cup blueberries", "½ cup apple cider or unsweetened apple juice", "½ cup granulated sugar or Splenda®", "2 tablespoons fresh lemon juice"], "steps": ["Place the apples, strawberries, blueberries, cider, Splenda®, and lemon juice in a medium bowl.", "Stir to combine.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Serve warm or transfer “Berried” Applesauce to a resealable container.", "Let cool, then cover and refrigerate.", "Keeps refrigerated about 1 week. . 0mg"], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 141, "date_added": "2026-10-31T14:17:04.877Z"}, {"title": "Cranberry Sauce", "description": "Jam cycle — Makes 2 cups", "ingredients": ["3 cups fresh or frozen cranberries, rinsed (remove and discard any stems)", "1 cup granulated sugar", "½ cup cranberry juice", "1½ teaspoons pure vanilla extract", "1 teaspoon grated orange zest"], "steps": ["Place the cranberries, sugar, juice, vanilla, and zest in a medium bowl.", "Stir to combine.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps sound at 5 and 10 minutes into the cycle.", "Transfer cranberry sauce to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated 4 to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 140, "date_added": "2026-10-31T14:17:04.864Z"}, {"title": "Peach, Mango, Papaya and Apricot Jam", "description": "Jam cycle — Makes about 3 cups", "ingredients": ["1 cup (8 ounces) diced (½-inch) peaches", "1 cup (6 ounces) diced (½-inch) mango", "1 cup (6 ounces) diced (½-inch) papaya", "½ cup (4 ounces) dried apricots, cut in quarters", "1¼ cups granulated sugar", "3 tablespoons fresh lemon juice", "¼ cup powdered pectin"], "steps": ["Place all ingredients in a medium bowl and stir.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Transfer jam to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated 4 to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 139, "date_added": "2026-10-31T14:17:04.851Z"}, {"title": "Tomato Chutney", "description": "Jam cycle — Makes about 4 cups", "ingredients": ["1 can (14 –15 ounce) diced tomatoes, with juices", "6 ounces finely chopped (¼-inch) onion (about 1 cup)", "5 ounces finely chopped (¼-inch) green pepper (1 cup)", "1 cup packed light brown sugar", "⅔ cup diced (¼-inch) apple", "½ cup golden raisins", "⅓ cup cider vinegar", "3 tablespoons powdered pectin", "2 tablespoons tomato paste", "1 teaspoon kosher salt", "1 teaspoon freshly ground black pepper", "1 teaspoon Tabasco® or other hot sauce", "½ teaspoon dry mustard", "¼ teaspoon ground allspice"], "steps": ["Place all ingredients in a medium bowl and stir to blend.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "When complete, spoon into clean dry jars.", "Let cool, then cover.", "Store in refrigerator for up to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 138, "date_added": "2026-10-31T14:17:04.837Z"}, {"title": "Tart Pink Grapefruit Marmalade", "description": "Jam cycle — Makes 3 cups", "ingredients": ["2½ pounds small to medium pink grapefruit (about 4)", "1⅓ cups granulated sugar", "¼ cup orgeat syrup", "1 box (1.75 ounces) powdered pectin"], "steps": ["Peel grapefruit using a sharp knife.", "Slice the bitter white pith from the peel, leaving just a thin layer on the peel.", "Discard bitter white pith.", "Cut the peel into thin (⅛-inch thick) slices and place in a medium bowl.", "Cut the grapefruit into sections, removing the membrane and seeds.", "Add the sections and any accumulated juices to the bowl.", "Stir in sugar.", "Cover and refrigerate for 24 hours – this is to tenderize the grapefruit peel.", "Stir the orgeat and pectin into the macerated grapefruit peel and sections.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Transfer marmalade to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated for 4 to 6 weeks.", "This makes a tart, English-style marmalade.", "For a sweeter marmalade, increase the sugar to 2 cups and the orgeat to ⅓ cup."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 137, "date_added": "2026-10-31T14:17:04.825Z"}, {"title": "Plum Cassis Jam", "description": "Jam cycle — Makes about 3 cups", "ingredients": ["2 pounds plums, pitted and cut into ¼-inch slices", "¾ cup granulated sugar", "⅓ cup crème de cassis liqueur", "¼ cup fresh lemon juice", "1 package (1.75 ounce) powdered pectin", "1 teaspoon cinnamon"], "steps": ["Place the sliced plums, sugar, cassis, lemon juice, pectin, and cinnamon in a medium bowl.", "Stir to combine.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Transfer Plum Cassis Jam to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated 4 to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 136, "date_added": "2026-10-31T14:17:04.812Z"}, {"title": "Blueberry Lime Jam", "description": "Jam cycle — Makes 3 cups", "ingredients": ["6 cups fresh blueberries", "1⅓ cups granulated sugar", "1 package (1.75 ounce) powdered pectin", "¼ cup fresh lime juice", "1 teaspoon grated fresh lime zest"], "steps": ["Place the blueberries, sugar, pectin, lime juice, and zest in a medium bowl.", "Stir to combine.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Transfer Blueberry Lime Jam to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated 4 to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 135, "date_added": "2026-10-31T14:17:04.797Z"}, {"title": "Bread-Machine Brioche", "description": "Dough/Pizza Dough cycle, shaped and baked in a conventional oven", "ingredients": ["Milk, regular or lowfat, 80°– 90°F: ¼ cup (1 lb) · ⅓ cup (1½ lb) · ½ cup (2 lb)", "Eggs, large, at room temperature: 2 (1 lb) · 3 (1½ lb) · 4 (2 lb)", "Unsalted butter, cut in ½-inch pieces, at room temperature: 4 tablespoons (1 lb) · 6 tablespoons (1½ lb) · 8 tablespoons (2 lb)", "Granulated sugar: 1 tablespoon (1 lb) · 1½ tablespoons (1½ lb) · 2 tablespoons (2 lb)", "Powdered milk: 1 tablespoon (1 lb) · 1½ tablespoons (1½ lb) · 2 tablespoons (2 lb)", "Salt: ¾ teaspoon (1 lb) · 1 teaspoon (1½ lb) · 1½ teaspoons (2 lb)", "Bread flour: 1¾ cups + 2 tablespoons (1 lb) · 2¾ cups + 1 tablespoon (1½ lb) · 3¾ cups (2 lb)", "Yeast, active dry, instant or bread machine Egg wash – 1 large egg beaten with 1 tablespoon water: 1½ teaspoons (1 lb) · 2¼ teaspoons (1½ lb) · 3 teaspoons (2 lb)"], "steps": ["Place the milk, eggs, butter, sugar, powdered milk, salt, bread flour, and yeast, in the order listed, in the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Dough/Pizza Dough.", "Select dough size.", "Press Start to mix, knead and rise.", "This dough is very soft; it is recommended to scrape the bowl after 10 minutes of kneading to ensure even distribution and mixing of ingredients.", "When dough cycle is completed, remove dough, punch to deflate and transfer to a well-buttered bowl.", "Cover with plastic wrap and refrigerate for 1 hour.", "Deflate dough and divide into the number and size brioches desired.", "For 1 or 1½ - pound brioche, remove ⅙ of the dough.", "Shape the larger piece into a ball and press into a buttered 6-inch brioche mold.", "Press a hole in the center about 1 inch deep.", "Shape the smaller piece into a ball and place in the center hole.", "For individual brioches, follow the same shaping directions, and place in ½ - cup brioche molds.", "Cover loosely with plastic wrap and let rise in a warm (90°F), draft-free place about 45 minutes.", "Preheat oven to 350°F.", "Brush brioche(s) with egg wash.", "Bake in preheated oven for 15 to 20 minutes for individual brioches, and about 20 to 30 minutes for larger brioches, until rich golden in color and hollow-sounding when tapped.", "Remove from pans and transfer to wire rack to cool.", "Bread slices best when allowed to cool. *Gently and safely warm cold eggs by placing whole eggs in a bowl and covering with moderately hot tap water for 10 minutes."], "personal_notes": "Delay Start: no", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-dough", "bread", "dough"], "id": 134, "date_added": "2026-10-31T14:17:04.776Z"}, {"title": "French Bread Baguettes", "description": "Dough/Pizza Dough cycle, shaped and baked in a conventional oven", "ingredients": ["Water, 80°– 90°F: ¾ cup (1 or 2 loaves) · 1⅛ cups (2 loaves) · 1½ cups (3 loaves)", "Salt: 1 teaspoon (1 or 2 loaves) · 1½ teaspoons (2 loaves) · 2 teaspoons (3 loaves)", "Granulated sugar: ½ teaspoon (1 or 2 loaves) · ¾ teaspoon (2 loaves) · 1 teaspoon (3 loaves)", "Bread flour: 2 cups (1 or 2 loaves) · 3 cups (2 loaves) · 4 cups (3 loaves)", "Wheat germ: 1½ tablespoons (1 or 2 loaves) · 2 tablespoons (2 loaves) · 3 tablespoons (3 loaves)", "Yeast, active dry, instant or bread machine: 1¼ teaspoons (1 or 2 loaves) · 1¾ teaspoons (2 loaves) · 2¼ teaspoons (3 loaves)"], "steps": ["Place all ingredients, in the order listed, in the bread pan fitted with the kneading paddle and place in bread maker.", "Press Menu and select Dough/Pizza Dough.", "Select dough size.", "Press Start to mix, knead and rise.", "When cycle is completed, remove dough, punch to deflate and let rest 10 minutes.", "Divide dough into appropriate number of equal pieces, depending upon size prepared.", "Shape each piece of dough into a long narrow baguette and place on a baking sheet that has been dusted with cornmeal.", "Cover loosely with plastic wrap and let rise 30 to 40 minutes.", "While baguettes rise, place a pan of hot water on the bottom rack of the oven and preheat oven to 425°F.", "Dust dough gently with additional flour.", "Make 4 diagonal slashes in each loaf about ¼-inch deep using a serrated knife.", "Bake bread in preheated oven 25 to 30 minutes until browned and hollow-sounding when tapped.", "When cycle is completed, remove bread from machine and transfer to wire rack to cool.", "Bread slices best when allowed to cool."], "personal_notes": "Delay Start: yes", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-dough", "bread", "dough"], "id": 133, "date_added": "2026-10-31T14:17:04.764Z"}, {"title": "Cherry Bounce Jam", "description": "Jam cycle — Makes about 3 cups", "ingredients": ["1½ pounds pitted sweet dark cherries (thaw if using frozen)", "¾ cup granulated sugar", "3 tablespoons Kirschwasser", "3 tablespoons fresh lemon juice", "1 package (1.75 ounce) powdered pectin", "½ teaspoon ground allspice"], "steps": ["Place the cherries, sugar, Kirschwasser, lemon juice, pectin, and allspice in a medium bowl.", "Stir to combine.", "Transfer to the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Transfer Cherry Bounce Jam to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated 4 to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 132, "date_added": "2026-10-31T14:17:04.750Z"}, {"title": "Strawberry Rhubarb Jam", "description": "Jam cycle — Makes about 3 cups", "ingredients": ["1 pound fresh strawberries, stemmed and quartered or halved", "12 ounces fresh rhubarb, cut in ½-inch slices", "⅔ cup granulated sugar", "⅓ cup packed brown sugar", "¼ cup powdered pectin", "½ teaspoon ground cinnamon"], "steps": ["Place half the strawberries in a bowl with ⅓ cup of the granulated sugar.", "Use a potato masher or fork to mash roughly – it should be slightly chunky with some liquid.", "Add remaining ingredients and stir to combine.", "Transfer the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Jam.", "Press Start.", "Scrape the sides of the pan when tone beeps at 5 and 10 minutes into the cycle.", "Transfer jam to clean jars.", "Let cool, then cover and refrigerate.", "Keeps refrigerated 4 to 6 weeks."], "personal_notes": "Delay Start: not applicable (Jam cycle)", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-jam"], "id": 131, "date_added": "2026-10-31T14:17:04.734Z"}, {"title": "Sweet Potato Cloverleaf Rolls", "description": "Dough/Pizza Dough cycle, shaped and baked in a conventional oven", "ingredients": ["Sweet potato, peeled and cubed Reserved cooking water from sweet potatoes: 6–8 ounces (½ cup mashed) (8 rolls) · 8–10 ounces (¾ cup mashed) (12 rolls) · 12–14 ounces (1 cup mashed) (18 rolls)", "Nonfat dry milk: ¼ cup (8 rolls) · ⅓ cup (12 rolls) · ½ cup (18 rolls)", "Brown sugar, firmly packed: 2 tablespoons (8 rolls) · 3 tablespoons (12 rolls) · ¼ cup (18 rolls)", "Unsalted butter, at room temperature, cut in ¼-inch pieces: 2 tablespoons (8 rolls) · 3 tablespoons (12 rolls) · ¼ cup (18 rolls)", "Kosher or sea salt: ¾ teaspoon (8 rolls) · 1 teaspoon (12 rolls) · 1¼ teaspoons (18 rolls)", "Bread flour: 2 cups (8 rolls) · 3 cups (12 rolls) · 4 cups (18 rolls)", "Yeast, active dry, instant or bread machine Cooking spray Milk for brushing tops of rolls: 1 teaspoon (8 rolls) · 2 teaspoons (12 rolls) · 3 teaspoons (18 rolls)"], "steps": ["Place the cubed sweet potatoes in a saucepan with water to cover by 1 inch.", "Bring to a boil, then reduce heat and simmer until potatoes are tender, about 15 to 20 minutes.", "Drain, reserving cooking water.", "Measure out necessary amount of reserved cooking water for size of recipe being prepared: ½ cup – ⅓ cup – ¼ cup and let cool to 90°F.", "Mash sweet potatoes and measure out necessary amount for size recipe being prepared: 1 cup – ¾ cup – ½ cup.", "Place measured mashed sweet potatoes, measured cooking liquid, nonfat dry milk, brown sugar, butter, salt, bread flour and yeast in baking pan fitted with kneading paddle.", "Press Menu and select Dough/Pizza Dough.", "Select dough size.", "Press Start to mix, knead and rise.", "When dough is ready, remove from baking pan and deflate.", "Divide into 18 – 12 – 9 equal portions, depending on size recipe prepared.", "Lightly coat regular muffin tin ( ing paddle.", "Place the bread pan in the bread maker.", "Press Menu and Select Dough/Pizza Dough.", "Select dough size.", "Press Start to mix, knead and rise.", "When cycle is completed, remove dough from machine and transfer to a lightly floured surface.", "Preheat oven to 350°F.", "Divide the dough into the number of pieces that the recipe size indicates.", "Roll each piece into an oval and place on a baking sheet lined with parchment paper and cover with plastic.", "Allow to rest for about 30 minutes until the rolls have about doubled in size.", "Once rolls have doubled, cut 2 small slashes across each roll with a serrated knife.", "Dust with whole wheat flour and bake in preheated oven for about 20 to 25 minutes, until they are a dark golden.", "Once finished, transfer rolls to a wire cooling rack.", "Note: This recipe can also be shaped into large oval loaves.", "Follow the same directions for the rolls but shape the dough into one large oval-shaped loaf.", "If you are using the 2-lb. recipe, divide the dough into two equal pieces and shape each loaf.", "Place on baking sheet lined with parchment and wrap the loaf/loaves in plastic.", "Allow to rest for 30 minutes, until the loaf has doubled in size.", "When loaf is ready, slash the top diagonally 3 times across the top.", "Bake in preheated 350°F oven for approximately 25 to 30 minutes until it is dark golden and sounds hollow when rapped on the bottom.", "Once finished, remove from pan and transfer to wire rack to cool.", "Bread slices best when allowed to cool."], "personal_notes": "Delay Start: no", "source_reference": "Cuisinart CBK-200 Convection Bread Maker booklet", "source_type": "manual", "tags": ["bread-maker-dough", "bread", "dough"], "id": 129, "date_added": "2026-10-31T14:16:33.809Z"}, {"title": "Molasses Whole Wheat Rolls with Currants and Pecans", "description": "Dough/Pizza Dough cycle, shaped and baked in a conventional oven", "ingredients": ["Milk, lowfat: 7 tablespoons (8-10 rolls) · ½ cup ", "bread", "dough"], "id": 128, "date_added": "2026-10-31T14:16:33.794Z"}, {"title": "Cheddar Breadsticks", "description": "Dough/Pizza Dough cycle, shaped and baked in a conventional oven", "ingredients": ["Water, 80°– 90°F: ½ cup (25 sticks) · ¾ cup (30 sticks) · 1 cup (40-45 sticks)", "Olive oil: ¼ cup (25 sticks) · ⅓ cup (30 sticks) · 6 tablespoons (40-45 sticks)", "Salt: ¾ teaspoon (25 sticks) · 1½ teaspoons (30 sticks) · 2 teaspoons (40-45 sticks)", "Granulated sugar: ½ teaspoon (25 sticks) · ½ teaspoon (30 sticks) · 1 teaspoon (40-45 sticks)", "Bread flour: 2¼ cups (25 sticks) · 3 cups (30 sticks) · 3¾ cups (40-45 sticks)", "Shredded Cheddar cheese: ¾ cup (25 sticks) · 1 cup (30 sticks) · 1¼ cups (40-45 sticks)", "Paprika: ¾ teaspoon (25 sticks) · 1 teaspoon (30 sticks) · 1¼ teaspoons (40-45 sticks)", "Yeast, active dry, instant or bread machine: 2 teaspoons (25 sticks) · 2¼ teaspoons (30 sticks) · 2¼ teaspoons (40-45 sticks)"], "steps": ["Place ingredients, in the order listed, in the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Dough/Pizza Dough.", "Select dough size.", "Press Start to mix, knead and rise.", "When cycle is completed, remove dough from machine and transfer to a lightly floured surface.", "Preheat oven to 375°.", "Line baking sheets with parchment paper.", "Roll the dough out into a rectangle, ¼-inch thick, 10 inches long and between 16 and 24 inches wide, depending on the dough size.", "Roll the rectangle so that its width runs from left to right.", "With a pizza cutter or sharp knife, cut strips that are each ½-inch wide.", "Twist each strip so it resembles a cheese straw.", "Place on parchment-lined baking sheet and cover with plastic and allow to rest for about 30 minutes.", "Once breadsticks have rested, brush with olive oil and bake until golden – about 15 to 20 minutes.", "Transfer to a wire rack to cool slightly and serve."], "personal_notes": "Delay Start: yes", "sour -31T14:16:33.752Z"}, {"title": "Soft Pretzels", "description": "Dough/Pizza Dough cycle, shaped and baked in a conventional oven", "ingredients": ["Water, 80°– 90°F: ¾ cup (8 pretzels) · 1 cup (12 pretzels) · 1¼ cups (16 pretzels)", "Salt: 1½ teaspoons (8 pretzels) · 2 teaspoons (12 pretzels) · 1 tablespoon + ¼ cup (16 pretzels)", "Brown sugar, firmly packed: 2½ teaspoons (8 pretzels) · 1 tablespoon (12 pretzels) · 1 tablespoon + 1 teaspoon (16 pretzels)", "Bread flour: 2 cups + 6 tablespoons (8 pretzels) · 3¼ cups (12 pretzels) · 4 cups (16 pretzels)", "Yeast, active dry, instant or bread machine: 2 teaspoons (8 pretzels) · 2¼ teaspoons (12 pretzels) · 2¼ teaspoons (16 pretzels)", "Water: 2 cups (8 pretzels) · 2 cups (12 pretzels) · 2 cups (16 pretzels)", "Baking soda: 2 tablespoons (8 pretzels) · 2 tablespoons (12 pretzels) · 2 tablespoons (16 pretzels)"], "steps": ["Place the water, salt, brown sugar, bread flour and yeast (do not add the second amount of water or the baking soda) in the bread pan fitted with the kneading paddle.", "Place the bread pan in the bread maker.", "Press Menu and select Dough/Pizza Dough.", "Select dough size.", "Press Start to mix, knead and rise.", "When cycle is completed, remove dough from machine and transfer to a floured surface.", "Divide dough into equal pieces according to the specific recipe size.", "Roll each ball into a thin rope.", "Twist dough into a pretzel shape and place on a baking sheet lined with parchment paper.", "Cover with plastic and allow pretzels to rest for about 20 to 30 minutes.", "Place 2 inches of water in a wide 5½ quart sauté pan and bring to a boil.", "Preheat oven to 425°F.", "Place the 2 cups of water and baking soda in a small bowl, stir and reserve.", "Once pretzels have rested and water comes to a boil, carefully slide pretzels into the boiling water one at a time, flipping each after 1½ minutes.", "Boil for 3 minutes total.", "Allow pretzels to drain on a wire cooling rack.", "Dip each pretzel in 3, "date_added": "2026-10-31T14:16:08.219Z"}, {"title": "Apricot Cheese Danish Braid", "description": "Dough/Pizza Dough cycle (Basic Sweet Dough), shaped and baked in a conventional oven", "ingredients": ["Basic Sweet Dough: 2 pounds (2 braids) · 1½ pounds (1 braid) · 1 pound (1 braid)", "Cream cheese, cut in ½-inch pieces, at room temperature: 4 ounces (1 braid) · 6 ounces (1 braid) · 8 ounces (2 braids)", "Granulated sugar: 2 tablespoons (1 braid) · 3 tablespoons (1 braid) · ¼ cup (2 braids)", "Cornstarch: 1 tablespoon (1 braid) · 4 teaspoons (1 braid) · 2 tablespoons (2 braids)", "Egg, large, at room temperature: 2 tablespoons (½ beaten egg – 1 small) (1 braid) · 3 tablespoons (1 medium) (1 braid) · 1 (2 braids)", "Pure vanilla extract: ½ teaspoon (1 braid) · ¾ teaspoon (1 braid) · 1 teaspoon (2 braids)", "Apricot preserves: 6 tablespoons (1 braid) · 9 tablespoons, divided (1 braid) · 12 tablespoons, divided (2 braids)", "Egg wash: 1 large egg beaten with 1 tablespoon water"], "steps": ["Place cream cheese, sugar, cornstarch, egg, and vanilla in a medium bowl and whisk until smooth (this may also be done in a food processor fitted with the metal “s” blade or with a hand mixer).", "Cover and refrigerate until ready to use.", "For 2-pound and 1½-pound recipes, divide dough into 2 equal pieces.", "Roll out dough into a rectangle 18x12 inches for 2-pound size or 14x10-inches for 1½-pound size.", "Place on a parchment-lined baking sheet.", "Spread cream cheese filling over the center third (lengthwise portion) of rectangle and top with 6 (4½) tablespoons apricot preserves.", "Cut 1-inch wide strips from edge of filling to edge of dough along 18-inch sides.", "Begin braid by folding top row toward filling.", "Alternately fold strips at an angle from each side across filling toward opposite side.", "Fold bottom row toward filling and finish by stretching last strip and tucking under.", "Preheat oven to 350°F.", "Cover and let rise until nearly doubled.", "Brush with eg
