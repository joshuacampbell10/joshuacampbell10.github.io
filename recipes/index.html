<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes &middot; Personal Site</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       margin: 0; padding: 0 16px 48px; max-width: 760px; margin-left: auto; margin-right: auto;
       line-height: 1.5; }
header { padding: 20px 0 8px; border-bottom: 1px solid #ccc; margin-bottom: 16px; }
header h1 { font-size: 1.4rem; margin: 0 0 8px; }
nav a { margin-right: 16px; text-decoration: none; font-weight: 600; }
nav a.active { text-decoration: underline; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.controls input[type="search"], .controls select {
  font-size: 1rem; padding: 8px 10px; border: 1px solid #999; border-radius: 8px; }
.controls input[type="search"] { flex: 1 1 200px; }
.card { border: 1px solid #ccc; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 1.1rem; }
.badges { margin: 6px 0; }
.badge { display: inline-block; font-size: 0.75rem; background: #eee; color: #333;
         border-radius: 20px; padding: 2px 10px; margin: 0 6px 4px 0; }
.meta { color: #666; font-size: 0.85rem; }
.detail { margin-top: 10px; }
.detail h4 { margin: 12px 0 4px; font-size: 0.95rem; }
.detail ul, .detail ol { margin: 4px 0 8px; padding-left: 22px; }
.empty { color: #666; padding: 24px 0; }
footer { margin-top: 32px; color: #888; font-size: 0.8rem; }
.home-links { display: grid; gap: 12px; margin-top: 16px; }
.home-links a { display: block; border: 1px solid #ccc; border-radius: 10px;
                padding: 16px; text-decoration: none; color: inherit; }
.home-links a strong { font-size: 1.15rem; display: block; margin-bottom: 4px; }
.home-links a span { color: #666; font-size: 0.9rem; }
</style>
</head>
<body>
<header><h1>Personal Site</h1><nav><a href="/" class="">Home</a><a href="/recipes/" class="active">Recipes</a><a href="/media/" class="">Media List</a></nav></header>
<main>
<h2>Recipes</h2>
<div class="controls">
<input type="search" id="q" placeholder="Search recipes...">
<select id="src"><option value="">All sources</option>
<option value="photo">Photo</option><option value="note">Note</option>
<option value="tiktok">TikTok</option><option value="reddit">Reddit</option>
<option value="manual">Manual</option></select>
<select id="tag"><option value="">All tags</option><option value="breakfast">breakfast</option><option value="burritos">burritos</option><option value="freezer">freezer</option><option value="meal prep">meal prep</option><option value="potatoes">potatoes</option><option value="side">side</option></select>
</div>
<div id="list"></div>
<script>
const RECIPES = [{"date_added": "2026-10-10T12:21:18.729Z", "description": "Feeds 4 as a side.", "id": 1, "ingredients": ["1kg Maris Piper potatoes", "Vegetable oil", "2 tsp smoked paprika", "1 tsp dried oregano", "Ground sea salt"], "personal_notes": "", "source_reference": "@amysheppardfood on TikTok", "source_type": "tiktok", "steps": ["Peel the potatoes, cut them into wedges and soak them in cold water for a couple of minutes, changing the water twice to rinse off the starch.", "Place the wedges in a saucepan and cover them in cold salted water.", "Bring the potato water to a simmer and cook for around 5 minutes. The potatoes should still be firm enough to shake them up without them breaking.", "Heat the oven to 220C fan.", "Drain the potatoes in a colander and give them a good shake. Stir them with the metal prongs of a fork to fluff them up a little. Leave in the colander until there is no longer steam coming off them.", "Heat oil in a thin-based roasting tin (enough to just cover the bottom so all the wedges touch the base) until spitting hot.", "Stir the paprika and oregano into the oil.", "Tip the wedges into the pan and use a fish slice to turn them over until coated in herby oil.", "Season generously with salt.", "Roast in the oven for 12 minutes, remove and turn them over again to get another coating of the oil.", "Return to the oven for 12 more minutes, remove again and turn them over, before roasting for a final 5-7 minutes or until crisp and cooked through."], "tags": ["side", "potatoes"], "title": "Crispy Smoked Paprika Potato Wedges", "updated_at": "2026-10-10T12:21:18.729Z"}, {"description": "Makes 10 burritos — store frozen. Per burrito: 445 calories, 33g protein, 46g carbs, 14g fat. Highly customizable.", "id": 2, "ingredients": ["Veggie base:", "1 red bell pepper, diced", "1 orange bell pepper, diced", "1 yellow onion, diced", "400g yellow potatoes (~2-3), diced", "30g (2 Tbsp) olive oil", "Salt and pepper to taste", "Lean breakfast sausage:", "448g (16oz) 93% lean ground beef or turkey", "2 tsp coarse salt", "1 tsp garlic powder", "1 tsp chili powder", "1/2 tsp rubbed sage", "1/2 tsp Italian seasoning", "1/2 tsp cumin", "(or your favorite all-purpose seasoning)", "Egg mixture:", "650g (2.75 cups) egg whites", "3 eggs", "200g (1 cup) cottage cheese", "8g (1 Tbsp) corn starch", "50g (1/2 cup) shredded cheddar", "10 burrito-sized tortillas", "High-protein cream sauce:", "400g (2 cups) fat-free Greek yogurt", "50g (3 Tbsp) hot sauce of choice", "Garlic, salt and pepper to taste", "Cilantro, as garnish"], "personal_notes": "Pan: a 10x15 inch 'jelly roll' pan with 1-inch lip. A half-size sheet pan works but the rectangles come out shorter and wider.", "source_reference": "Stealth Health Life on TikTok", "source_type": "tiktok", "steps": ["Add your veggies/roasting ingredients of choice to a sheet pan and roast until softened.", "Add your protein source of choice over the top and bake until browned.", "Pour over the blended egg mixture, top with the cheddar, and bake until the middle is firm and the edges are crisp.", "Let sit for 10 minutes before slicing.", "Slice into equally sized rectangles. Add each to a burrito-sized tortilla along with sauce and garnishes of choice.", "Roll the burritos and enjoy — or wrap and store frozen."], "tags": ["meal prep", "breakfast", "burritos", "freezer"], "title": "Sheet Pan Breakfast Burritos"}];
const SRC_LABEL = {photo:"Photo",note:"Note",tiktok:"TikTok",reddit:"Reddit",manual:"Manual"};
const q = document.getElementById('q'), src = document.getElementById('src'),
      tag = document.getElementById('tag'), list = document.getElementById('list');
function badge(t){ return '<span class="badge">'+t+'</span>'; }
function render(){
  const needle = q.value.trim().toLowerCase();
  const items = RECIPES.filter(r => {
    if (src.value && r.source_type !== src.value) return false;
    if (tag.value && !(r.tags||[]).includes(tag.value)) return false;
    if (needle) {
      const hay = (r.title+' '+(r.description||'')+' '+(r.ingredients||[]).join(' ')).toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  });
  if (!items.length) { list.innerHTML = '<p class="empty">No recipes match. Add some from the app and this page will update.</p>'; return; }
  list.innerHTML = items.map((r,i) => `
    <div class="card">
      <h3>${r.title}</h3>
      <div class="badges">${badge(SRC_LABEL[r.source_type]||r.source_type)}${(r.tags||[]).map(badge).join('')}</div>
      ${r.description ? `<p>${r.description}</p>` : ''}
      <div class="detail" id="d${i}" style="display:none">
        <h4>Ingredients</h4><ul>${(r.ingredients||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
        <h4>Steps</h4><ol>${(r.steps||[]).map(x=>`<li>${x}</li>`).join('')}</ol>
        ${r.personal_notes ? `<h4>Notes</h4><p>${r.personal_notes}</p>` : ''}
        ${r.source_reference ? `<p class="meta">Source: ${r.source_reference}</p>` : ''}
      </div>
      <a href="#" onclick="document.getElementById('d${i}').style.display =
        document.getElementById('d${i}').style.display==='none'?'block':'none'; return false;">Show details</a>
    </div>`).join('');
}
[q,src,tag].forEach(el => el.addEventListener('input', render));
render();
</script></main>
<footer>Personal collection &middot; updated automatically</footer>
</body>
</html>
