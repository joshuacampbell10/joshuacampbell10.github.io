<script>
const RECIPES = [{"date_added": "2026-10-10T12:21:18.729Z", "description": "Feeds 4 as a side.", "id": 1, "ingredients": ["1kg Maris Piper potatoes", "Vegetable oil", "2 tsp smoked paprika", "1 tsp dried oregano", "Ground sea salt"], "personal_notes": "", "source_reference": "@amysheppardfood on TikTok", "source_type": "tiktok", "steps": ["Peel the potatoes, cut them into wedges and soak them in cold water for a couple of minutes, changing the water twice to rinse off the starch.", "Place the wedges in a saucepan and cover them in cold salted water.", "Bring the potato water to a simmer and cook for around 5 minutes. The potatoes should still be firm enough to shake them up without them breaking.", "Heat the oven to 220C fan.", "Drain the potatoes in a colander and give them a good shake. Stir them with the metal prongs of a fork to fluff them up a little. Leave in the colander until there is no longer steam coming off them.", "Heat oil in a thin-based roasting tin (enough to just cover the bottom so all the wedges touch the base) until spitting hot.", "Stir the paprika and oregano into the oil.", "Tip the wedges into the pan and use a fish slice to turn them over until coated in herby oil.", "Season generously with salt.", "Roast in the oven for 12 minutes, remove and turn them over again to get another coating of the oil.", "Return to the oven for 12 more minutes, remove again and turn them over, before roasting for a final 5-7 minutes or until crisp and cooked through."], "tags": ["side", "potatoes"], "title": "Crispy Smoked Paprika Potato Wedges", "updated_at": "2026-10-10T12:21:18.729Z"}, {"description": "Makes 10 burritos — store frozen. Per burrito: 445 calories, 33g protein, 46g carbs, 14g fat. Highly customizable.", "id": 2, "ingredients": ["Veggie base:", "1 red bell pepper, diced", "1 orange bell pepper, diced", "1 yellow onion, diced", "400g yellow potatoes (~2-3), diced", "30g (2 Tbsp) olive oil", "Salt and pepper to taste", "Lean breakfast sausage:", "448g (16oz) 93% lean ground beef or turkey", "2 tsp coarse salt", "1 tsp garlic powder", "1 tsp chili powder", "1/2 tsp rubbed sage", "1/2 tsp Italian seasoning", "1/2 tsp cumin", "(or your favorite all-purpose seasoning)", "Egg mixture:", "650g (2.75 cups) egg whites", "3 eggs", "200g (1 cup) cottage cheese", "8g (1 Tbsp) corn starch", "50g (1/2 cup) shredded cheddar", "10 burrito-sized tortillas", "High-protein cream sauce:", "400g (2 cups) fat-free Greek yogurt", "50g (3 Tbsp) hot sauce of choice", "Garlic, salt and pepper to taste", "Cilantro, as garnish"], "personal_notes": "Pan: a 10x15 inch 'jelly roll' pan with 1-inch lip. A half-size sheet pan works but the rectangles come out shorter and wider.", "source_reference": "Stealth Health Life on TikTok", "source_type": "tiktok", "steps": ["Add your veggies/roasting ingredients of choice to a sheet pan and roast until softened.", "Add your protein source of choice over the top and bake until browned.", "Pour over the blended egg mixture, top with the cheddar, and bake until the middle is firm and the edges are crisp.", "Let sit for 10 minutes before slicing.", "Slice into equally sized rectangles. Add each to a burrito-sized tortilla along with sauce and garnishes of choice.", "Roll the burritos and enjoy — or wrap and store frozen."], "tags": ["meal prep", "breakfast", "burritos", "freezer"], "title": "Sheet Pan Breakfast Burritos"}, {"description": "Cajun-style chicken and dumplings made with biscuit dumplings.", "id": 3, "ingredients": ["3 boneless, skinless chicken breasts", "2 tbsp Worcestershire sauce", "1 tbsp mustard", "1 tsp salt", "1 tsp black pepper", "1 tbsp Cajun seasoning", "1 tsp garlic powder", "1 tsp onion powder", "1 tsp McCormick's Garlic & Herb seasoning", "Olive oil, for browning", "1 stick (1/2 cup) butter", "1 onion, chopped", "1 bell pepper, chopped", "3 stalks celery, chopped", "5 cloves garlic, minced", "32 oz chicken broth", "1 can cream of mushroom soup", "1 can cream of chicken soup", "1 tsp each: salt, pepper, Cajun seasoning, garlic powder, and McCormick's Garlic & Herb seasoning (for the sauce)", "1 can Pillsbury Grands Buttery Flaky Biscuits, cut into quarters"], "personal_notes": "", "source_reference": "Little Cajun House on TikTok", "source_type": "tiktok", "steps": ["Marinate the chicken: in a bowl, combine the Worcestershire sauce, mustard, salt, pepper, Cajun seasoning, garlic powder, onion powder, and McCormick's Garlic & Herb. Add the chicken breasts and marinate at least 30 minutes (or overnight for deeper flavor).", "Brown the chicken: heat a little olive oil in a large heavy pot or Dutch oven over medium-high heat. Brown the chicken 3-4 minutes per side until golden brown. Remove and set aside.", "Saute the Holy Trinity: in the same pot, melt the stick of butter. Add the chopped onion, bell pepper, and celery; saute 6-8 minutes until softened. Add the minced garlic and cook another minute.", "Make the base: pour in the chicken broth, cream of mushroom, and cream of chicken soups. Season with salt, pepper, Cajun seasoning, garlic powder, and McCormick's Garlic & Herb. Stir well.", "Simmer the chicken: add the browned chicken back to the pot. Cover and simmer on medium-low for 25 minutes.", "Add the dumplings: cut each biscuit into quarters. Layer the biscuit pieces evenly over the chicken mixture, spooning a bit of sauce over them. Cover and simmer 15 minutes (do not lift the lid).", "Finish: remove the lid and gently break up and stir the dumplings into the sauce."], "tags": ["dinner", "cajun", "chicken", "comfort food"], "title": "Cajun Chicken and Dumplings"}, {"description": "Hearty split pea soup with ham bone, vegetables, and garlic.", "id": 4, "ingredients": ["3 bags split peas, cleaned", "Water as directed on bag", "1 heaping tablespoon marjoram leaf", "1 heaping tablespoon pepper", "1 ham bone and a couple pieces of fat", "3 chicken bouillon cubes", "3 bay leaves", "3 heaping tablespoons minced garlic", "1 bag carrots, cleaned and sliced", "1 big white onion, chopped"], "personal_notes": "", "source_reference": "Johnny Blakes", "source_type": "tiktok", "steps": ["Add 3 bags of split peas (cleaned) and water as directed on the bag.", "Boil the peas and scoop off the scum from the top (very important).", "Let boil for 3 minutes, then remove from flame, cover, and let sit for 1 hour.", "Add the heaping tablespoon of marjoram leaf, heaping tablespoon of pepper, ham bone, and fat.", "Stir constantly.", "When the meat is falling off the bone, remove the bone and fat from the pot. Throw the fat away, cut the meat from the bone and put it back in the pot (give the bone to the dog).", "Add 3 chicken bouillon cubes, 3 bay leaves, 3 heaping tablespoons minced garlic, 1 bag of carrots (cleaned and sliced), and 1 big white onion (chopped).", "Stir constantly - the peas stick to the bottom of the pot and burn, ruining the soup."], "tags": ["soup", "dinner"], "title": "Johnny Blakes Pea Soup"}, {"id": 6, "title": "Dirty Rice", "description": "", "ingredients": [], "steps": ["Sauté diced vegetables in butter.", "Stir in and brown ground meat (sausage, pork, ground beef, etc).", "Season.", "Mix in dry rice and combine well, then add double the amount of liquid (stock).", "Cover and simmer until done."], "tags": ["dinner", "rice", "cajun"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 9, "title": "Minestrone", "description": "", "ingredients": [], "steps": ["Sauté onion, celery, carrot, garlic, red potato, and seasoning.", "Add crushed tomato, broth, pasta, beans, and basil.", "Cover and simmer for 30 minutes."], "tags": ["soup"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 5, "title": "Kielbasa and Cabbage", "description": "", "ingredients": [], "steps": ["Sauté kielbasa, then add carrots, celery, cabbage, and potatoes; stir well.", "Add seasonings and stir well: salt, pepper, bay leaf, Italian seasoning, and a little bit of cloves.", "Add broth and water."], "tags": ["soup", "dinner"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 8, "title": "Mortadella Sandwiches", "description": "Anthony Bourdain's Favorite Sandwich", "ingredients": [], "steps": ["Fry a couple slices of mortadella with cheese in a cast iron skillet.", "Toast a kaiser or brioche roll.", "Add mayo and Dijon."], "tags": ["sandwich"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 16, "title": "Turkey Subs", "description": "", "ingredients": [], "steps": ["Prepare tomato salad: dice a tomato, add oregano, salt, pepper, and olive oil.", "Cut into a sub roll; add mayo to the bottom and Italian seasoning.", "Layer lettuce on the bottom, top with submarine sauce and tomato salad.", "Add sliced mozzarella and shaved turkey breast."], "tags": ["sandwich"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 13, "title": "Shredded Beef Sandwiches", "description": "", "ingredients": [], "steps": ["Season a chuck roast with salt, pepper, and garlic; sear in a Dutch oven.", "Add a couple tablespoons of butter, a packet of au jus gravy, 1 tbsp Worcestershire, and A1.", "Add a 12 oz beer, a sliced onion, and 1 tbsp minced garlic.", "Cover and bake at 350°F for 2.5 hours.", "Shred the meat; toast sub rolls and top with Swiss and shredded beef, then broil to melt.", "Use remaining au jus as dip."], "tags": ["sandwich", "beef"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 7, "title": "Shredded Chicken Sandwiches", "description": "", "ingredients": [], "steps": ["Add a pound of chicken to the crockpot; season with salt, pepper, garlic.", "Add 1/4 cup pickle juice and wing sauce.", "Cook on low for 4 hours.", "Shred the chicken; add more wing sauce and serve on toasted burger buns with ranch and pickles."], "tags": ["sandwich", "chicken", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 15, "title": "French Onion Roast Beef and Cheddar Sliders", "description": "", "ingredients": [], "steps": ["Melt butter in a pan and caramelize one onion. Add thyme and garlic, then 1 tbsp flour and stir in.", "Slowly whisk in 1.5 cups beef stock and 2 tsp Worcestershire; season to taste.", "Remove from heat and mix with 1 lb sliced roast beef cut to bite-size pieces.", "Toast the bottoms of Hawaiian rolls in a baking dish with butter; top with the beef mix and cheddar.", "Add the top buns and bake until the top is crispy."], "tags": ["sandwich", "beef"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 14, "title": "Catfish Filets", "description": "", "ingredients": [], "steps": ["Put catfish filets in a bowl; season with Sazón, garlic powder, and Old Bay.", "Coat in a little buttermilk.", "Mix flour, cornmeal, cornstarch, and seasoning in a ziploc bag.", "Coat the fish in the flour mixture.", "Fry in oil."], "tags": ["dinner", "fish"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 10, "title": "Blue Collar Belly Warmer", "description": "", "ingredients": [], "steps": ["Layer mashed potatoes in a casserole dish.", "Cook 1 lb ground beef in a can of gravy.", "Add corn and green beans.", "Cut 4 biscuits into quarters and lay them into the casserole.", "Bake at 350°F until done."], "tags": ["dinner", "casserole"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 11, "title": "Chicken and Stuffing", "description": "", "ingredients": [], "steps": ["Layer about 6 chicken tenderloins in a glass baking dish.", "Cover with a can of cream of chicken soup.", "Top with black pepper.", "Top with a box of Stove Top stuffing.", "Cover with chicken stock to moisten everything.", "Cook at 375°F covered for 10 minutes, then uncovered for 10 minutes."], "tags": ["dinner", "chicken"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 12, "title": "Samoan Corn Beef Gravy", "description": "", "ingredients": [], "steps": ["Put 1/3 cup oil in a pan.", "Add one large onion chopped in large pieces; once softened, add half a head of garlic finely chopped.", "Before the garlic burns, add 6 tbsp flour.", "Cook until the flour browns; add 2 cups water.", "Once the gravy is thick, add a can of corned beef.", "Mix in salt and pepper; serve over rice."], "tags": ["dinner"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 17, "title": "Pot Roast (w/ Packets)", "description": "", "ingredients": [], "steps": ["Season the roast with salt, pepper, a ranch seasoning packet, Montreal steak seasoning, garlic powder, and paprika.", "Sear in a Dutch oven.", "Remove the roast; add onion, garlic, tomato paste, and broth.", "Add more seasonings plus a pot roast seasoning packet.", "Add the roast back and simmer for 1 hour.", "Add potatoes and carrots; simmer another 1.5 hours.", "Serve over mashed potatoes or rice."], "tags": ["dinner", "beef", "pot-roast"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 19, "title": "Crockpot Ribs", "description": "", "ingredients": [], "steps": ["Prep a rack of ribs; season liberally and coat with Sweet Baby Ray's.", "Add to the crockpot with a sliced red onion.", "Add 2 cups of Coke or Dr Pepper.", "Cook on low 7-8 hours until fall-off-the-bone.", "Add more BBQ sauce and finish 30 minutes."], "tags": ["dinner", "ribs", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 18, "title": "Crockpot Jambalaya", "description": "", "ingredients": [], "steps": ["Put 2 lb sliced kielbasa, 2 chopped red bell peppers, 1 yellow onion, 1 sliced jalapeño, 2.5 cups chicken broth, 2 cups instant rice, 3 tbsp Cajun seasoning, some Worcestershire, and 1 tbsp minced garlic in the crockpot.", "Cook on low for 3 hours."], "tags": ["dinner", "cajun", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 21, "title": "Cheesy Pizza Tortellini", "description": "", "ingredients": [], "steps": ["Cook a pound of ground beef; season with salt, pepper, onion powder, and Italian seasoning. (Test with ground Italian sausage.)", "Add 1/3 cup mini pepperoni and cook down.", "Add minced garlic, half a block of cream cheese, and a jar of marinara.", "Add one bag of frozen tortellini; cover and simmer 5-7 minutes.", "Top with shredded cheese and mini pepperoni; melt the cheese."], "tags": ["dinner", "pasta"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 25, "title": "Beef Braised Short Ribs", "description": "", "ingredients": [], "steps": ["Coat short ribs in salt and pepper.", "Heat oil in a Dutch oven; sear short ribs in batches.", "Remove all short ribs.", "Braise carrots, onion, celery, and garlic.", "Add tomato paste, red wine, beef broth, thyme, and bay leaves.", "Bake until tender.", "Remove short ribs and strain out the vegetables.", "Reduce the remaining liquid to make the sauce."], "tags": ["dinner", "beef", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 27, "title": "Short Rib Ragu", "description": "", "ingredients": [], "steps": ["Season four short ribs and sear on all sides.", "Remove short ribs; add olive oil, carrots, celery, and onion to the Dutch oven.", "Add garlic, tomato paste, and red wine; stir.", "Add a can of crushed tomatoes, rosemary, oregano, and beef stock.", "Return short ribs to the pan; cover and simmer.", "Remove short ribs when tender; shred and return to the pan.", "Add cream and ragu noodles; serve with parmesan."], "tags": ["dinner", "beef", "pasta", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 26, "title": "Swedish Meatballs", "description": "", "ingredients": [], "steps": ["Mix 1 lb spicy Italian sausage with half an onion, garlic, 1/2 cup breadcrumbs, 1 egg, ginger, black pepper, nutmeg, and allspice.", "Cook the meatballs in a sauté pan with butter; set aside.", "Add the other half of the onion and more butter.", "Add 2 tbsp flour, 1.5 cups beef broth, brown mustard, and Worcestershire.", "Add cooked noodles and meatballs."], "tags": ["dinner", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 22, "title": "Hot Honey Chicken", "description": "", "ingredients": [], "steps": ["Marinate 8-10 chicken tenderloins in 1 cup buttermilk, 1/4 cup hot sauce, salt, black pepper, cayenne, garlic powder, and onion powder. Marinate through the day.", "Mix 1 cup flour with cayenne, salt, black pepper, garlic powder, and onion powder.", "Mix 1 cup buttermilk with hot sauce, salt, and black pepper.", "Take chicken from the marinade; dredge in flour, soak in milk, then flour again. Rest 10 minutes.", "Fry until golden brown.", "For the glaze, simmer 1/4 cup butter with 1 tbsp hot sauce and 1 tbsp honey."], "tags": ["dinner", "chicken", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 23, "title": "Mini Chicken Pot Pies", "description": "", "ingredients": [], "steps": ["Shred all meat off a rotisserie chicken.", "Add a can of cream of mushroom and a can of cream of chicken to a pot with a bag of mixed vegetables; season liberally.", "Heat up; add the shredded chicken with a little stock. (Test if pre-baking the bottoms helps.)", "Layer dough in a muffin pan, add filling, and top with pie crust.", "Top with butter; bake at 400°F until crispy and done."], "tags": ["dinner", "chicken", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 24, "title": "Steak Alfredo w/ Cajun Butter", "description": "", "ingredients": [], "steps": ["Season filets with salt, pepper, and garlic powder; grill the steaks.", "Mix softened butter with Cajun seasoning.", "Boil the pasta.", "Homemade Alfredo: melt a stick of butter in a saucepan, add 16 oz half and half and bring to a simmer; slowly mix in 2 cups parmesan cheese.", "Serve the pasta with Alfredo, topped with steak and Cajun butter."], "tags": ["dinner", "steak", "pasta", "fancy"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 28, "title": "Huli Huli", "description": "", "ingredients": [], "steps": ["Mix soy sauce, pineapple juice, brown sugar, ginger, garlic, and rice vinegar.", "Marinate for a few hours."], "tags": ["marinade"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 20, "title": "Corn Souffle", "description": "", "ingredients": [], "steps": ["Mix 1 can sweet cream corn, 1 can whole kernel corn (drained), 1 box Jiffy corn muffin mix, half a stick of melted butter, and 1 cup sour cream.", "Grease a baking dish and pour in the mixture.", "Bake in a preheated 350°F oven for 1.5 hours."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 36, "title": "Crispy Parm Potatoes", "description": "", "ingredients": [], "steps": ["Slice baby potatoes in half.", "Line a small baking sheet with parchment; add olive oil to the parchment.", "Layer shredded parmesan; place the potatoes face-down on the parmesan.", "Drizzle olive oil on top; bake."], "tags": ["side", "potatoes"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 34, "title": "Collard Greens", "description": "", "ingredients": [], "steps": ["Chop one onion and a pack of bacon; add to a pot with oil and minced garlic.", "Slice a bunch of collards to remove the stems; wash and slowly add to the pot, stirring. Add more oil as necessary.", "Add salt, pepper, and red pepper flakes; stir very well to combine.", "Add 2-3 cups of stock with 1 cup of brown sugar and some Tabasco; stir well.", "Bring to a boil and simmer covered for 1 hour."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 31, "title": "Twice Baked Potatoes", "description": "", "ingredients": [], "steps": ["Stab potatoes with a fork multiple times; coat in oil, salt, and pepper; wrap with aluminum foil.", "Bake completely; cut a slice down the middle.", "Scoop out the insides and mix with milk, shredded cheese, melted butter, sour cream, bacon bits, salt, pepper, and garlic powder.", "Put the mixture back into the potato skins; rebake."], "tags": ["side", "potatoes"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 33, "title": "Parmesan Carrot Fries", "description": "", "ingredients": [], "steps": ["Cut 1 lb large peeled carrots into fries.", "Toss with 1/3 cup grated parmesan, salt, pepper, minced garlic, and oil.", "Bake at 400°F for 25-30 minutes."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 38, "title": "Creamy Orzo", "description": "", "ingredients": [], "steps": ["Brown 5 tbsp butter in a pot.", "Add 2 finely minced shallots and 2 tsp minced garlic; caramelize.", "Add fresh rosemary and 1/2 tbsp honey.", "Add 1.5 cups dry orzo and toast.", "Add 4 cups chicken broth, salt, pepper, paprika, and onion powder.", "Cook on medium-high 10-15 minutes; add 1/2 cup heavy cream and 1/2 cup fresh parmesan."], "tags": ["side", "pasta"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 40, "title": "Spaghetti Squash", "description": "", "ingredients": [], "steps": ["Place the spaghetti squash in a crockpot with about 1.5 cups of water; cook on low for 2 hours.", "Scoop out the seeds. (Test baking the seeds in the oven.)", "Fluff the insides with a fork; top with butter, salt, and pepper."], "tags": ["side"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 35, "title": "Authentic Fried Rice", "description": "", "ingredients": [], "steps": ["Cut up 1/2 pack Chinese-style sausage; dice an onion.", "Scramble 7-8 eggs in a different pan.", "Cook the sausage low in the wok to get some fat in the pan.", "Remove the sausage; cook chicken in the fat and oil, then remove.", "Add oil; cook onion, green onion, garlic, peas, and carrots.", "Once cooked through, add everything back including day-old rice.", "Add soy sauce, sesame oil, dark soy sauce, black pepper, white pepper, and Maggi seasoning."], "tags": ["side", "rice"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 30, "title": "Cinnamon Roll Pie Crust", "description": "", "ingredients": [], "steps": ["Use any pie filling.", "Use a can of cinnamon rolls as the crust.", "Layer cinnamon rolls on the bottom and on top of the filling.", "Egg-wash the top cinnamon rolls and cut slots."], "tags": ["dessert"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 32, "title": "Crock pot Blueberry Cobbler", "description": "", "ingredients": [], "steps": ["Dump 2 cans of blueberry pie filling in the crockpot.", "Smooth the filling; add a box of cake mix on top.", "Cut 2 sticks of butter into knobs and distribute evenly.", "Serve with vanilla ice cream."], "tags": ["dessert", "crockpot"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 29, "title": "Banana Pudding", "description": "", "ingredients": [], "steps": ["Blend 1 cup sweetened condensed milk with 1.5 cups cold water.", "Add 1 box instant vanilla pudding mix nce": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 47, "title": "Seven days of Breakfast Oatmeal", "description": "", "ingredients": [], "steps": ["Grab 7 deli pint containers.", "Per container: 1/2 cup oatmeal, 1 scoop whey protein, dash of cinnamon.", "The night before, add a handful of frozen berries, fill with water, and leave in the fridge overnight."], "tags": ["health", "breakfast", "meal-prep"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 48, "title": "Ground Beef and Rice", "description": "", "ingredients": [], "steps": ["Add oil to a pan; brown onion and garlic.", "Add 1 lb ground beef.", "Season with soy sauce, oyster sauce, chili powder, mirin, and honey.", "Add green onion; serve over rice with avocado and fried egg."], "tags": ["health", "beef", "rice"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 53, "title": "Protein Apple Pie", "description": "", "ingredients": [], "steps": ["Heat a can of sugar-free apple pie filling in a pan; add 1/2 cup water and boil.", "Add 1 cup cinnamon protein powder; mix very well.", "Blend down granola for topping; spread evenly and spray with butter.", "Broil until golden brown; top with sugar-free ice cream."], "tags": ["health", "dessert", "protein"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 46, "title": "Vegetable Pasta", "description": "", "ingredients": [], "steps": ["Cut 1 onion, 2 bell peppers, 1 cucumber, 2 tomatoes, 2 carrots, and a clove of garlic into large chunks.", "Place on a baking dish; coat with olive oil and roast until broken down.", "Blend the roasted vegetables with a little cream.", "Serve on protein pasta with a side salad."], "tags": ["health", "pasta"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 52, "title": "Cowboy Butter", "description": "", "ingredients": [], "steps": ["Melt butter with garlic, lemon juice, lemon zest, salt, pepper, paprika, and cayenne.", "Stir in Dijon mustard, chili flakes, thyme, chives, and parsley.", "Use as a steak dip."], "tags": ["sauce"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 49, "title": "Dijon Pork Sauce", "description": "", "ingredients": [], "steps": ["Cook pork chops in a steel pan.", "Over medium heat, melt butter; add a minced shallot and salt.", "Once the shallot is translucent, add minced garlic; sauté 5 minutes.", "Deglaze with white wine; reduce.", "Add chicken stock, then cream; simmer and reduce until thick.", "Season with salt and pepper; stir in Dijon mustard.", "Return the pork to the pan to heat through; serve the pork chops with the sauce."], "tags": ["sauce", "pork"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}, {"id": 50, "title": "Blackberry Gin", "description": "", "ingredients": [], "steps": ["Add a tub of blackberries to a mason jar; fill with gin.", "Let infuse for a week."], "tags": ["drink"], "source_type": "note", "source_reference": "Josh's Recipe Book PDF", "personal_notes": ""}];
const SRC_LABEL = {photo:"Photo",note:"Note",tiktok:"TikTok",reddit:"Reddit",manual:"Manual"};
const q = document.getElementById('q'), src = document.getElementById('src'),
      tag = document.getElementById('tag'), list = document.getElementById('list');
function badge(t){ return '<span class="badge">'+t+'</span>'; }
function render(){
  const needle = q.value.trim().toLowerCase();
  const items = RECIPES.filter(r => {
    if (src.value && r.source_type !== src.value) return false;
    if (tag.value && !(r.tags||[]).includes(tag.value)) return false;
    if (needle) {
      const hay = (r.title+' '+(r.description||'')+' '+(r.ingredients||[]).join(' ')).toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  });
  if (!items.length) { list.innerHTML = '<p class="empty">No recipes match. Add some from the app and this page will update.</p>'; return; }
  list.innerHTML = items.map((r,i) => `
    <div class="card">
      <h3>${r.title}</h3>
      <div class="badges">${badge(SRC_LABEL[r.source_type]||r.source_type)}${(r.tags||[]).map(badge).join('')}</div>
      ${r.description ? `<p>${r.description}</p>` : ''}
      <div class="detail" id="d${i}" style="display:none">
        <h4>Ingredients</h4><ul>${(r.ingredients||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
        <h4>Steps</h4><ol>${(r.steps||[]).map(x=>`<li>${x}</li>`).join('')}</ol>
        ${r.personal_notes ? `<h4>Notes</h4><p>${r.personal_notes}</p>` : ''}
        ${r.source_reference ? `<p class="meta">Source: ${r.source_reference}</p>` : ''}
      </div>
      <a href="#" onclick="document.getElementById('d${i}').style.display =
        document.getElementById('d${i}').style.display==='none'?'block':'none'; return false;">Show details</a>
    </div>`).join('');
}
[q,src,tag].forEach(el => el.addEventListener('input', render));
render();
</script></main>
